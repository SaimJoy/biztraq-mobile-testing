name: Flutter

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_patrol:
        description: Run Patrol on an Android emulator
        type: boolean
        default: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test --coverage --dart-define=API_BASE_URL=https://biztraqonline.com
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://biztraqonline.com

  patrol:
    if: github.event_name == 'workflow_dispatch' && inputs.run_patrol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub global activate patrol_cli
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: patrol test -t patrol_test/counter_test.dart --dart-define=API_BASE_URL=https://biztraqonline.com
